packages:
  # Apps - use glob patterns
  - 'APPS/**'
  
  # Packages - list individually
  - 'PACKAGES/ui'
  - 'PACKAGES/utils'
  - 'PACKAGES/seo'
  - 'PACKAGES/analytics'
  - 'PACKAGES/auth'
  - 'PACKAGES/api-client'
  - 'PACKAGES/database'
  - 'PACKAGES/payments'
  - 'PACKAGES/email'
  - 'PACKAGES/ai'
  
  # Backend services
  - 'SERVICES/*'

# Force exact versions
shared-workspace-dependencies: true
shared-workspace-lockfile: true

# Hoist common dependencies (reduce duplication)
hoist-pattern:
  - '*'
  - '@boldmind/*'