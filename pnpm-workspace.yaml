packages:
  - 'APPS/WEB_APPS/*'
  - 'APPS/WEB_APPS/PLANAI_SUITE/*'
  - 'APPS/MOBILE/*'
  - 'APPS/CONCEPT_APPS/*'
  
  - 'PACKAGES/ui'
  - 'PACKAGES/utils'
  - 'PACKAGES/seo'
  - 'PACKAGES/analytics'
  - 'PACKAGES/auth'
  - 'PACKAGES/api-client'
  - 'PACKAGES/database'
  - 'PACKAGES/payments'
  - 'PACKAGES/email'
  - 'PACKAGES/ai'

shared-workspace-dependencies: true
shared-workspace-lockfile: true

hoist-pattern:
  - '*'
  - '@boldmind/*'

shamefully-hoist: true
strict-peer-dependencies: false
auto-install-peers: true

node-linker: hoisted
hoist-workspace-packages: true