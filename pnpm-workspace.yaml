packages:
  # Frontend apps
  - 'apps/*'

  # Shared packages
  - 'packages/*'

  # Backend service (NestJS monolith)
  - 'service'

  # Tooling
  - 'tooling/*'

shared-workspace-lockfile: true

hoist-pattern:
  - '*'

shamefully-hoist: true
strict-peer-dependencies: false
auto-install-peers: true

node-linker: hoisted
hoist-workspace-packages: true
