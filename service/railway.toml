[build]
  builder = "NIXPACKS"
  buildCommand = "pnpm install --frozen-lockfile && pnpm build"

[deploy]
  startCommand = "node dist/main"
  healthcheckPath = "/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

[[deploy.envs]]
  name = "NODE_ENV"
  value = "production"
